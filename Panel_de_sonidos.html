<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de sonidos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#eef1f4;--ink:#121a23;--mute:#5d6b79;--line:#c9d2db;--soft:#e0e6ec;--acc:#2f3fe8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e141b;--ink:#e8eef4;--mute:#93a2b1;--line:#26313c;--soft:#18212b;--acc:#8c98ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e141b;--ink:#e8eef4;--mute:#93a2b1;--line:#26313c;--soft:#18212b;--acc:#8c98ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:clamp(16px,4vw,40px)}
h1{font-size:clamp(1.7rem,4.5vw,2.6rem);line-height:1.05;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:6px}.top h1{margin:0}.note{color:var(--mute);margin:0 0 18px}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.deck{--cols:5;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(8px,1.6vw,16px);background:linear-gradient(#1b232d,#131920);border:1px solid #2a3440;border-radius:28px;box-shadow:0 18px 40px -22px rgb(0 0 0/.6),inset 0 1px 0 rgb(255 255 255/.06);padding:clamp(12px,2.4vw,24px)}
body.over .deck{outline:3px dashed var(--acc);outline-offset:4px}
.key,.slot{aspect-ratio:1;border-radius:14px;min-width:0}
.key{position:relative;overflow:hidden;border:0;padding:8px;display:flex;align-items:flex-end;text-align:left;color:#fff;cursor:pointer;
font:600 clamp(.78rem,1.8vw,1rem)/1.15 "Bricolage Grotesque",system-ui,sans-serif;background:hsl(var(--h) 52% 34%);
box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),0 4px 0 hsl(var(--h) 52% 20%);transition:transform .08s,box-shadow .08s}
.key:active,.key.hit{transform:translateY(3px);box-shadow:inset 0 0 0 1px rgb(255 255 255/.14),0 1px 0 hsl(var(--h) 52% 20%)}
.key.on{background:hsl(var(--h) 62% 44%);box-shadow:inset 0 0 0 2px #fff,0 4px 0 hsl(var(--h) 52% 20%),0 0 24px hsl(var(--h) 85% 58%/.5)}
.key.bad{opacity:.45}
.nm{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-bottom:6px}
.key kbd{position:absolute;top:7px;left:7px;font:800 .8rem/1 "Bricolage Grotesque",system-ui,sans-serif;padding:4px 7px;border-radius:6px;background:rgb(0 0 0/.4)}
.key kbd:empty{display:none}.btn kbd{font:inherit;font-size:.72rem;margin-left:6px;padding:2px 6px;border-radius:5px;border:1px solid currentColor;opacity:.8}
.pg{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgb(255 255 255/.9);transform-origin:left;transform:scaleX(var(--p,0))}
.x{display:none;position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#e5484d;place-items:center;font-size:1rem;line-height:1}
.edit .x{display:grid}.tm{position:absolute;top:8px;right:8px;font:600 .75rem/1 "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums;padding:3px 6px;border-radius:6px;background:rgb(0 0 0/.4)}.tm:empty,.edit .tm{display:none}.deck.edit{outline:2px solid #e5484d;outline-offset:4px}
.slot{border:2px dashed #34414e;background:transparent}
.add{color:#9fb0c0;font:400 2.2rem/1 "Bricolage Grotesque",system-ui,sans-serif;cursor:pointer;border-color:#4b5b6b}
.add:hover{border-color:#8c98ff;color:#8c98ff}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 16px;padding:10px 0;color:var(--mute);font-size:.92rem;background:var(--bg);border-bottom:1px solid var(--line)}@media (min-width:721px){.bar{position:sticky;top:0;z-index:5}}
.bar label{display:flex;align-items:center;gap:8px}
.btn{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.4;cursor:default}.grow{flex:1}.grp{display:flex;align-items:center;gap:8px}.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{font:inherit;color:var(--ink);background:none;border:0;padding:8px 14px;cursor:pointer}.seg button:not([aria-pressed=true]):hover{background:var(--soft)}.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.go{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}.go:hover{background:var(--acc);filter:brightness(1.1)}.pill{display:inline-flex;align-items:center;gap:8px;margin:0;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mute);font-size:.92rem;max-width:100%}.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}.pill[data-on]{color:var(--ink)}.pill[data-on]::before{background:#2fb872}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
input[type=range],input[type=checkbox]{accent-color:var(--acc)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#msg{margin:16px 0 0;min-height:1.5em}
@media (prefers-reduced-motion:reduce){.key{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Panel de sonidos</h1><p class="pill" id="now" aria-live="off">En silencio</p></div>
  <p class="note">Pulsa un botón o su tecla. También puedes arrastrar audios a la página.</p>
  <div class="bar">
    <button class="btn go" id="stop">Detener todo <kbd>Esc</kbd></button>
    <label>Volumen <input type="range" id="vol" min="0" max="1" step="0.01" value="1"></label>
    <div class="grp"><span>Al pulsar</span><div class="seg" id="mode" role="group" aria-label="Al pulsar un sonido que ya suena"><button data-m="restart" aria-pressed="true" title="Reinicia el sonido desde el principio">Reiniciar</button><button data-m="toggle" aria-pressed="false" title="Si ya suena, lo para">Alternar</button></div></div>
    <button class="btn" id="solo" aria-pressed="false">Un sonido a la vez</button>
    <span class="grow"></span>
    <button class="btn" id="addb">Añadir audios</button>
    <button class="btn" id="edit" aria-pressed="false">Quitar audios</button>
  </div>
  <div class="deck" id="deck"></div>
  <input type="file" id="file" class="vh" accept="audio/*" multiple tabindex="-1" aria-hidden="true">
  <p id="msg" class="note" role="status"></p>
</main>
<script>
/* Audios incluidos en la web. Para añadir uno, copia el mp3 a la carpeta ./audios/ y suma una línea: ['archivo.mp3','Nombre del botón'] */
const AUDIOS=[
  ['00_Verdad_o_cuento.mp3','Verdad o cuento'],
  ['01_Point_of_Entry.mp3','Point of Entry'],
  ['02_Mid_Program_Rise.mp3','Mid Program Rise'],
  ['03_AM_at_the_Crossing.mp3','AM at the Crossing'],
  ['04_Cold_Glass_Warm_Air.mp3','Cold Glass Warm Air'],
  ['05_Breath_Caught_Short.mp3','Breath Caught Short'],
  ['06_The_Breaking_Point.mp3','The Breaking Point'],
  ['07_The_Last_Impression.mp3','The Last Impression'],
  ['08_Someone_Is_Calling.mp3','Someone Is Calling'],
  ['09_Twelve_Seconds_Remaining.mp3','Twelve Seconds Remaining'],
  ['10_The_Anvil_Incident.mp3','The Anvil Incident'],
  ['11_Midnight_Meter.mp3','Midnight Meter'],
  ['12_Before_the_Next_Chapter.mp3','Before the Next Chapter'],
  ['13_The_Two_Honk_Salute.mp3','The Two Honk Salute'],
  ['14_Extension_.mp3','Extension?'],
  ['15_Continue_Anyway_.mp3','Continue Anyway?'],
  ['16_Perfect_Run.mp3','Perfect Run']
];
const DIR='./audios/';

const $=s=>document.querySelector(s);
const SC='0123456789qwertyuiopasdfghjklzxcvbnm';
let list=[],seq=0,vol=1,mode='restart',solo=false,edit=false,raf=0,lastC=0;
const say=t=>{$('#msg').textContent=t};
const ok=f=>f.type.startsWith('audio/')||/\.(mp3|wav|ogg|oga|m4a|aac|flac|opus|weba)$/i.test(f.name);
const colsNow=()=>innerWidth>720?5:innerWidth>460?4:3;

function make(name,url,f){
  const a=new Audio(url);
  a.preload='auto';a.volume=vol;
  const it={f,url,a,name,h:(seq++*53+210)%360};
  a.onplay=a.onpause=kick;a.onerror=()=>fallback(it);
  list.push(it);
}
function add(files){
  let bad=0;
  for(const f of files){
    if(!ok(f)){bad++;continue}
    make(f.name.replace(/\.[^.]+$/,''),URL.createObjectURL(f),f);
  }
  say(bad?bad+(bad>1?' archivos no parecen de audio y se han ignorado.':' archivo no parece de audio y se ha ignorado.'):'');
  render();
}
function fallback(it){
  if(!it.f){it.bad=1;say('No se encuentra «'+it.name+'». Comprueba que la carpeta audios está junto a este HTML y que el archivo está dentro.');render();return}
  if(it.tried||it.f.size>80e6){it.bad=1;say('No se puede reproducir «'+it.name+'». Prueba con MP3, WAV, OGG o M4A.');render();return}
  it.tried=1;const r=new FileReader();
  r.onload=()=>{it.a.src=r.result};r.readAsDataURL(it.f);
}
function render(){
  const n=list.length;
  if(!n&&edit){edit=false;$('#edit').setAttribute('aria-pressed','false')}
  const C=lastC=colsNow(),total=Math.max(3*C,Math.ceil((n+1)/C)*C),dk=$('#deck');
  dk.style.setProperty('--cols',C);dk.classList.toggle('edit',edit);dk.textContent='';
  for(let i=0;i<total;i++){
    let b;
    if(i<n){
      const it=list[i];b=document.createElement('button');
      b.className='key'+(it.bad?' bad':'');b.style.setProperty('--h',it.h);
      b.innerHTML='<kbd></kbd><span class="nm"></span><i class="pg"></i><b class="x" aria-hidden="true">×</b><span class="tm"></span>';
      b.children[0].textContent=(SC[i]||'').toUpperCase();b.children[1].textContent=it.name;
      b.setAttribute('aria-label',(edit?'Quitar ':'Reproducir ')+it.name);b.title=it.name;
      b.onclick=()=>press(i);it.el=b;
    }else if(i===n){
      b=document.createElement('button');b.className='slot add';b.textContent='+';
      b.setAttribute('aria-label','Añadir audios');b.onclick=()=>$('#file').click();
    }else{
      b=document.createElement('div');b.className='slot';b.setAttribute('aria-hidden','true');
    }
    dk.append(b);
  }
  $('#stop').disabled=$('#edit').disabled=!n;
  kick();
}
function press(i){
  const it=list[i];if(!it)return;
  if(edit){rm(i);return}
  if(it.bad){say('Este audio no se puede reproducir. Comprueba que el archivo existe y es un mp3 válido.');return}
  const a=it.a;
  if(mode==='toggle'&&!a.paused){a.pause();a.currentTime=0;kick();return}
  if(solo)for(const o of list)if(o!==it&&!o.a.paused){o.a.pause();o.a.currentTime=0}
  a.currentTime=0;
  a.play().catch(e=>{if(e.name!=='AbortError')say('El navegador no pudo reproducir «'+it.name+'».')});
  kick();
}
function rm(i){
  const it=list[i];
  it.a.onerror=null;it.a.pause();it.a.removeAttribute('src');it.a.load();
  if(it.url.startsWith('blob:'))URL.revokeObjectURL(it.url);
  list.splice(i,1);render();
}
function stopAll(){for(const o of list){o.a.pause();o.a.currentTime=0}kick()}
const fmt=s=>{s=Math.ceil(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tick(){
  let any=false;const pl=[];
  for(const it of list){
    const p=!it.a.paused;if(p){any=true;pl.push(it.name)}
    if(it.el){it.el.classList.toggle('on',p);it.el.style.setProperty('--p',p&&it.a.duration?it.a.currentTime/it.a.duration:0);
      const t=it.el.querySelector('.tm');if(t)t.textContent=p&&it.a.duration?fmt(it.a.duration-it.a.currentTime):''}
  }
  const n=$('#now'),m=pl.length?'Sonando: '+pl.join(', '):'En silencio';
  if(n.textContent!==m)n.textContent=m;
  n.toggleAttribute('data-on',any);
  if(any)raf=requestAnimationFrame(tick);
}
function kick(){cancelAnimationFrame(raf);tick()}

$('#file').onchange=e=>{add(e.target.files);e.target.value=''};
$('#addb').onclick=()=>$('#file').click();
$('#stop').onclick=stopAll;
$('#edit').onclick=e=>{edit=!edit;e.currentTarget.setAttribute('aria-pressed',edit);say(edit?'Modo quitar: pulsa un botón para eliminarlo.':'');render()};
$('#vol').oninput=e=>{vol=+e.target.value;for(const o of list)o.a.volume=vol};
$('#mode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;for(const x of $('#mode').children)x.setAttribute('aria-pressed',x===b)};
$('#solo').onclick=e=>{solo=!solo;e.currentTarget.setAttribute('aria-pressed',solo)};

addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('over')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('over')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('over');add(e.dataTransfer.files)});
addEventListener('keydown',e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==='Escape'){stopAll();return}
  if(e.key.length!==1)return;
  const i=SC.indexOf(e.key.toLowerCase());
  if(i>=0&&list[i]){
    e.preventDefault();press(i);
    const el=list[i]&&list[i].el;if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),120)}
  }
});
addEventListener('resize',()=>{if(colsNow()!==lastC)render()});

for(const [file,name] of AUDIOS)make(name,DIR+file);
render();
</script>
</body>
</html>
